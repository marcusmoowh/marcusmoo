server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing: send unknown paths to index.html so React Router deep links
  # (e.g. /travel/japan, /blog/rising-again) work on refresh / direct visit.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # long-cache fingerprinted assets, never cache the HTML shell
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  # prerendered per-post OG pages (and any HTML) — always revalidate
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  # the GLB model + images
  location /models/ { expires 30d; add_header Cache-Control "public"; }
  location /photos/ { expires 30d; add_header Cache-Control "public"; }
}
