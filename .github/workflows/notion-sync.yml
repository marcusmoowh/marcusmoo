name: Sync Notion posts

on:
  schedule:
    - cron: '0 * * * *'      # hourly; adjust as you like
  workflow_dispatch: {}        # manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Import from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/import-notion.mjs
      - name: Commit changes if any
        run: |
          git config user.name  "notion-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/notion-posts.json public/notion
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: sync Notion posts"
            git push
          fi
